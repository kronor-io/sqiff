# HLint, as scripts/check runs it.
#
# The gate (scripts/check fast) runs only the rules named in scripts/check, which
# are the ones below: each enforces a rule from docs/readability.md. HLint's own
# suggestions are advice (scripts/check advice); several of them, such as eta
# reduction or bimap, work against that document and are not followed by default.

- arguments:
    - -XGHC2021
    - -XBlockArguments
    - -XStrictData
    - -XDerivingStrategies
    - -XLambdaCase

# R3: record a fact where it becomes known. A step says what it does in its role;
# its SQL is output, not a place to read meaning back from. A rule only matches
# calls through the module it names, so each is listed for Data.Text and RIO.Text.
- warn: {lhs: "Data.Text.isInfixOf x y.sql", rhs: stepRole, name: "Read the step's role, not its SQL"}
- warn: {lhs: "Data.Text.isPrefixOf x y.sql", rhs: stepRole, name: "Read the step's role, not its SQL"}
- warn: {lhs: "Data.Text.isSuffixOf x y.sql", rhs: stepRole, name: "Read the step's role, not its SQL"}
- warn: {lhs: "Data.Text.stripPrefix x y.sql", rhs: stepRole, name: "Read the step's role, not its SQL"}
- warn: {lhs: "RIO.Text.isInfixOf x y.sql", rhs: stepRole, name: "Read the step's role, not its SQL"}
- warn: {lhs: "RIO.Text.isPrefixOf x y.sql", rhs: stepRole, name: "Read the step's role, not its SQL"}
- warn: {lhs: "RIO.Text.isSuffixOf x y.sql", rhs: stepRole, name: "Read the step's role, not its SQL"}
- warn: {lhs: "RIO.Text.stripPrefix x y.sql", rhs: stepRole, name: "Read the step's role, not its SQL"}

# Known exceptions, each with its reason:
# - renderStep and renderScript end a statement with ";" unless it is a "--"
#   placeholder: that is about the text they write, not about what the step does.
# - shapeOf reads a column's options and a constraint's name back out of the SQL to
#   fill create-migration's templates. Steps would have to carry that data to fix it.
- ignore: {name: "Read the step's role, not its SQL", within: [Sqiff.Plan.renderStep, Sqiff.Sqitch.Units.renderScript, Sqiff.Sqitch.Units.shapeOf]}

# R6: name the queries the code keeps asking.
- warn: {lhs: "RIO.Map.findWithDefault RIO.Set.empty x d.exact", rhs: exactDependentsOf x d, name: "Use exactDependentsOf"}
- warn: {lhs: "RIO.Map.findWithDefault RIO.Set.empty x d.named", rhs: routinesNaming x d, name: "Use routinesNaming"}
- ignore: {name: "Use exactDependentsOf", within: [Sqiff.App.Dependents.exactDependentsOf]}
- ignore: {name: "Use routinesNaming", within: [Sqiff.App.Dependents.routinesNaming]}
