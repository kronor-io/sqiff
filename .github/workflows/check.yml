name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # GitHub-hosted, as every public kronor repository's CI is: a self-hosted
    # runner would run pull requests from forks on kronor's own machines.
    # arm64, so the builds pushed to the cache serve aarch64-linux machines too.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@96951a368ba55167b55f1c916f7d416bac6505fe # v31.10.3
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      # Reads from kronor-open and pushes what this job builds to it, as kronor's
      # other public packages do, so the dev shell, sqiff-lint's dependencies and
      # sqiff are built once.
      - uses: cachix/cachix-action@1eb2ef646ac0255473d23a5907ad7b04ce94065c # v17
        with:
          name: kronor-open
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      # docs/readability.md: formatting, sqiff's hopinion rules, the build with
      # its warnings as errors, and every test.
      - name: Check
        run: nix develop --print-build-logs --command scripts/check full
      - name: Build
        run: nix build --print-build-logs .#sqiff
      - name: Run
        run: ./result/bin/sqiff --help
