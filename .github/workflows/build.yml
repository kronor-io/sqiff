name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, arm64, builder]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nix on PATH
        run: |
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
          echo "/nix/var/nix/profiles/per-user/$USER/profile/bin" >> "$GITHUB_PATH"
          echo "/home/ubuntu/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Nix GitHub access token
        env:
          GH_TOKEN_FOR_NIX: ${{ secrets.GITHUB_TOKEN }}
        run: echo "NIX_CONFIG=access-tokens = github.com=$GH_TOKEN_FOR_NIX" >> "$GITHUB_ENV"
      - name: Build
        run: nix build --print-build-logs -j8 .#sqiff
      - name: Run
        run: ./result/bin/sqiff --help
